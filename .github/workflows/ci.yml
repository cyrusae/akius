name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-format:
    name: Check Code Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Run Cargo Fmt
        run: cargo fmt --all -- --check

  cargo-deny:
    name: Cargo Deny (Licenses & Security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Cargo Deny Check
        uses: EmbarkStudios/cargo-deny-action@v2

  clippy:
    name: Clippy Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies (Bevy)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config libx11-dev libxkbcommon-dev libwayland-dev
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Enable Rust Caching
        uses: swatinem/rust-cache@v2
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Run Unit Tests (Nextest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies (Bevy)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config libx11-dev libxkbcommon-dev libwayland-dev
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install Nextest
        uses: taiki-e/install-action@nextest
      - name: Enable Rust Caching
        uses: swatinem/rust-cache@v2
      - name: Run Tests with Nextest
        run: cargo nextest run --profile ci

  build-wasm:
    name: Verify WASM Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Enable Rust Caching
        uses: swatinem/rust-cache@v2
      - name: Run Cargo Check (WASM)
        run: cargo check --target wasm32-unknown-unknown
