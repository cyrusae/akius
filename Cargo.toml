[package]
name = "akius"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "0.18.1", features = ["wayland", "x11"] }
bevy_rapier3d = { version = "0.34.0", default-features = false, features = ["dim3", "simd-stable"] }
bevy_mesh = "0.18.1"
rand = "0.9"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
web-sys = { version = "0.3", features = ["Window", "Storage"] }

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1

# Enable a small amount of optimization in debug mode for the game code
[profile.dev]
opt-level = 1
debug = false
strip = true

# Enable high optimizations for dependencies (including Bevy, rapier, etc.) in debug mode
[profile.dev.package."*"]
opt-level = 3
