<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>akiuS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link data-trunk rel="rust" />
    <link data-trunk rel="copy-dir" href="assets" />
    <style>
        body {
            margin: 0;
            background: #111;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        canvas:focus {
            outline: none;
        }
    </style>
</head>
<body>
    <canvas id="bevy-canvas" tabindex="1" autofocus></canvas>
    <script>
        // Auto-focus canvas on load and keep it focused when clicked
        window.addEventListener('load', () => {
            const canvas = document.getElementById('bevy-canvas');
            if (canvas) {
                canvas.focus();
            }
        });
        document.addEventListener('click', () => {
            const canvas = document.getElementById('bevy-canvas');
            if (canvas) {
                canvas.focus();
            }
        });
    </script>
</body>
</html>
